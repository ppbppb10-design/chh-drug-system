<!-- ======================================================

====================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
 
const firebaseConfig = {
            apiKey: "AIzaSyAodw0pIkfOUKcWb8hVHLie_QvG0blRN48",
            authDomain: "drug--arrive.firebaseapp.com",
            databaseURL: "https://drug--arrive-default-rtdb.firebaseio.com",
            projectId: "drug--arrive",
            storageBucket: "drug--arrive.appspot.com",
            messagingSenderId: "215426668369",
            appId: "1:215426668369:web:eaa94e83974fcec391a570"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let ivDrugList = [];
let currentData = {};
let stopDraftSync = null;
let isRemoteSyncing = false;
let isInitialLoading = false;
let isCompletedToday = false;

const dateInput = document.getElementById("replenishDate");
const ivList = document.getElementById("ivList");
const syncStatus = document.getElementById("syncStatus");
const btnComplete = document.getElementById("btnComplete");

function setSyncStatus(text, type = "normal") {
    if (!syncStatus) return;
    syncStatus.textContent = text;
    syncStatus.className = "text-xs font-bold mt-1";
    if (type === "ok") {
        syncStatus.classList.add("text-emerald-100");
    } else if (type === "error") {
        syncStatus.classList.add("text-red-200");
    } else {
        syncStatus.classList.add("text-yellow-100");
    }
}

function updateCompleteButtonState(completed) {
    isCompletedToday = completed;
    if (completed) {
        btnComplete.className = "w-full bg-slate-500 text-white rounded-2xl py-5 font-black text-lg shadow-lg cursor-not-allowed";
        btnComplete.innerHTML = "✅ 已完成今日點滴撥補";
    } else {
        btnComplete.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl py-5 font-black text-lg shadow-lg";
        btnComplete.innerHTML = "✅ 完成今日點滴撥補";
    }
}

/* ======================================================
   ☁️ 即時同步
====================================================== */

onValue(
    ref(db, ".info/connected"),
    snapshot => {
        if (snapshot.val() === true) {
            setSyncStatus("🟢 雲端已連線", "ok");
        } else {
            setSyncStatus("🔴 雲端未連線", "error");
        }
    }
);

function startIVRealtimeSync() {
    if (stopDraftSync) {
        stopDraftSync();
        stopDraftSync = null;
    }

    const date = dateInput.value;
    if (!date) return;

    // 檢查正式完成狀態
    get(ref(db, `ivReplenishment/${date}`)).then(snapshot => {
        if (snapshot.exists() && snapshot.val().completed) {
            updateCompleteButtonState(true);
        } else {
            updateCompleteButtonState(false);
        }
    });

    const draftRef = ref(db, `ivReplenishmentDraft/${date}`);
    isInitialLoading = true;

    stopDraftSync = onValue(
        draftRef,
        snapshot => {
            const remoteData = snapshot.val() || {};

            if (!snapshot.exists()) {
                setSyncStatus("🟢 雲端已連線・尚無今日資料", "ok");
                isInitialLoading = false;
                return;
            }

            isRemoteSyncing = true;
            currentData = remoteData;

            ivDrugList.forEach(drug => {
                const itemData = currentData[drug.id] || {};
                // 允許數值為 0
                const qty = itemData.currentQty !== undefined ? Number(itemData.currentQty) : "";
                const safetyStock = Number(drug.safetyStock || 0);
                const numericQty = qty !== "" ? qty : 0;
                const need = Math.max(safetyStock - numericQty, 0);
                const afterQty = numericQty + need;

                const inputEl = document.querySelector(`.current-qty[data-id="${drug.id}"]`);
                if (inputEl && document.activeElement !== inputEl) {
                    inputEl.value = qty !== "" ? qty : "";
                }

                const card = document.querySelector(`.iv-card[data-id="${drug.id}"]`);
                if (card) {
                    const replenishDisplay = card.querySelector(".replenish-display");
                    if (replenishDisplay) {
                        replenishDisplay.textContent = need;
                        replenishDisplay.className = `replenish-display rounded-xl py-3 mt-1 text-center font-black ${
                            need > 0 ? "bg-red-50 text-red-600" : "bg-emerald-50 text-emerald-600"
                        }`;
                    }

                    const afterDisplay = card.querySelector(".after-display");
                    if (afterDisplay) {
                        afterDisplay.textContent = afterQty;
                    }

                    card.classList.remove("need", "ok");
                    card.classList.add(need > 0 ? "need" : "ok");
                }
            });

            updateSummary();
            isRemoteSyncing = false;
            isInitialLoading = false;

            setSyncStatus("🟢 已同步最新資料", "ok");
        }
    );
}

function getTodayString() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

dateInput.value = getTodayString();

function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
        now.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

updateClock();
setInterval(updateClock, 1000);

document.getElementById("btnHome").addEventListener("click", () => {
    location.href = "index.html";
});

document.getElementById("btnImportIVMaster").addEventListener("click", () => {
    document.getElementById("ivMasterExcel").click();
});

/* ======================================================
   📥 Excel 匯入
====================================================== */

document.getElementById("ivMasterExcel").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    try {
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: "array" });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

        if (!rows.length) {
            alert("❌ Excel 沒有資料");
            return;
        }

        const requiredColumns = ["藥品碼", "藥品名稱", "規格", "安全庫存量", "啟用"];
        const firstRow = rows[0];
        const missingColumns = requiredColumns.filter(column => !(column in firstRow));

        if (missingColumns.length) {
            alert("❌ Excel 欄位不正確\n\n缺少：\n" + missingColumns.join("\n"));
            return;
        }

        const newDrugList = [];
        rows.forEach((row, index) => {
            const id = String(row["藥品碼"]).trim();
            const name = String(row["藥品名稱"]).trim();
            const spec = String(row["規格"]).trim();
            const safetyStock = Number(row["安全庫存量"]);
            const enabledText = String(row["啟用"]).trim().toUpperCase();
            const sortOrder = index;

            if (!id && !name) return;
            if (!id) throw new Error(`第 ${index + 2} 列沒有藥品碼`);
            if (Number.isNaN(safetyStock) || safetyStock < 0) throw new Error(`第 ${index + 2} 列安全庫存量不正確`);

            const enabled = !["N", "NO", "0", "FALSE", "停用"].includes(enabledText);
            newDrugList.push({ id, name, spec, safetyStock, enabled, sortOrder });
        });

        if (!newDrugList.length) {
            alert("❌ 沒有有效的點滴資料");
            return;
        }

        const masterData = {};
        newDrugList.forEach(drug => {
            masterData[drug.id] = {
                id: drug.id,
                name: drug.name,
                spec: drug.spec,
                safetyStock: drug.safetyStock,
                enabled: drug.enabled,
                sortOrder: drug.sortOrder,
                updatedAt: new Date().toISOString()
            };
        });

        await set(ref(db, "ivDrugMaster"), masterData);
        ivDrugList = newDrugList.filter(d => d.enabled !== false);
        currentData = {};
        renderIVList();
        alert("🎉 點滴主檔匯入成功！");
    } catch (error) {
        alert("❌ 匯入失敗\n\n" + error.message);
    }
    event.target.value = "";
});

async function loadIVMaster() {
    try {
        const snapshot = await get(ref(db, "ivDrugMaster"));
        if (!snapshot.exists()) {
            ivDrugList = [];
            renderIVList();
            return;
        }
        const data = snapshot.val();
        ivDrugList = Object.values(data)
            .filter(drug => drug.enabled !== false)
            .sort((a, b) => Number(a.sortOrder ?? 999999) - Number(b.sortOrder ?? 999999));
        renderIVList();
    } catch (error) {
        console.error("載入點滴主檔失敗：", error);
    }
}

/* ======================================================
   💧 渲染清單
====================================================== */

function renderIVList() {
    if (!ivList) return;
    ivList.innerHTML = "";

    if (!ivDrugList.length) {
        ivList.innerHTML = `<div class="text-center py-12 text-slate-400"><div class="text-5xl mb-4">💧</div><div class="font-black">尚未有啟用中的點滴</div></div>`;
        updateSummary();
        return;
    }

    ivDrugList.forEach(drug => {
        const data = currentData[drug.id] || {};
        const currentQty = data.currentQty !== undefined ? data.currentQty : "";
        const numericQty = currentQty !== "" ? Number(currentQty) : 0;
        const safetyStock = Number(drug.safetyStock || 0);
        const replenishQty = Math.max(safetyStock - numericQty, 0);

        const card = document.createElement("div");
        card.className = `iv-card ${replenishQty > 0 ? "need" : "ok"} bg-white border border-slate-200 rounded-2xl p-4 shadow-sm`;
        card.setAttribute("data-id", drug.id);

        card.innerHTML = `
            <div class="flex justify-between items-start gap-3">
                <div class="flex-1 min-w-0">
                    <div class="font-black text-slate-800 text-base">${escapeHtml(drug.name)}</div>
                    <div class="text-xs text-slate-400 font-mono mt-1">${escapeHtml(drug.id)} · ${escapeHtml(drug.spec || "")}</div>
                </div>
                <div class="text-right shrink-0">
                    <div class="text-xs text-slate-400">安全庫存</div>
                    <div class="text-xl font-black text-blue-600">${safetyStock}</div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4">
                <div>
                    <div class="text-xs text-slate-400 text-center font-bold">樓上現有量</div>
                    <input type="number" min="0" step="1" inputmode="numeric"
                        value="${currentQty !== "" ? currentQty : ""}"
                        data-id="${escapeHtml(drug.id)}"
                        class="qty-input current-qty w-full border-2 border-slate-200 rounded-xl py-2 mt-1 bg-white">
                </div>
                <div>
                    <div class="text-xs text-slate-400 text-center font-bold">應撥補</div>
                    <div class="replenish-display rounded-xl py-3 mt-1 text-center font-black ${replenishQty > 0 ? "bg-red-50 text-red-600" : "bg-emerald-50 text-emerald-600"}">
                        ${replenishQty}
                    </div>
                </div>
                <div>
                    <div class="text-xs text-slate-400 text-center font-bold">補後庫存</div>
                    <div class="after-display bg-emerald-50 text-emerald-600 rounded-xl py-3 mt-1 text-center font-black">
                        ${numericQty + replenishQty}
                    </div>
                </div>
            </div>
        `;

        const input = card.querySelector(".current-qty");
        input.addEventListener("input", () => {
            let rawValue = input.value;
            rawValue = rawValue.replace(/[^0-9]/g, "");

            // 修正：允許輸入「0」而不被當作空白略過
            if (rawValue === "") {
                currentData[drug.id] = {
                    currentQty: "",
                    safetyStock: safetyStock,
                    replenishQty: safetyStock
                };
                card.querySelector(".replenish-display").textContent = safetyStock;
                card.querySelector(".after-display").textContent = safetyStock;
                updateSummary();
                return;
            }

            const qty = Math.floor(Number(rawValue));
            const need = Math.max(safetyStock - qty, 0);
            const afterQty = qty + need;

            currentData[drug.id] = {
                currentQty: qty,
                safetyStock: safetyStock,
                replenishQty: need
            };

            if (!isRemoteSyncing && !isInitialLoading && dateInput.value) {
                set(ref(db, `ivReplenishmentDraft/${dateInput.value}/${drug.id}`), {
                    currentQty: qty,
                    safetyStock: safetyStock,
                    replenishQty: need,
                    updatedAt: new Date().toISOString(),
                    updatedBy: document.getElementById("pharmacistName")?.value || ""
                }).catch(err => console.error(err));
            }

            const replenishDisplay = card.querySelector(".replenish-display");
            replenishDisplay.textContent = need;
            replenishDisplay.className = `replenish-display rounded-xl py-3 mt-1 text-center font-black ${need > 0 ? "bg-red-50 text-red-600" : "bg-emerald-50 text-emerald-600"}`;

            card.querySelector(".after-display").textContent = afterQty;
            card.classList.remove("need", "ok");
            card.classList.add(need > 0 ? "need" : "ok");
            updateSummary();
        });

        ivList.appendChild(card);
    });

    updateSummary();
}

function updateSummary() {
    const total = ivDrugList.length;
    let need = 0;
    let ok = 0;

    ivDrugList.forEach(drug => {
        const data = currentData[drug.id] || {};
        const qty = data.currentQty !== "" && data.currentQty !== undefined ? Number(data.currentQty) : 0;
        const safety = Number(drug.safetyStock || 0);
        const replenish = Math.max(safety - qty, 0);

        if (replenish > 0) {
            need++;
        } else {
            ok++;
        }
    });

    document.getElementById("totalItems").textContent = total;
    document.getElementById("needItems").textContent = need;
    document.getElementById("okItems").textContent = ok;
}

dateInput.addEventListener("change", () => {
    currentData = {};
    renderIVList();
    startIVRealtimeSync();
});

/* ======================================================
   💾 完成撥補
====================================================== */

btnComplete.addEventListener("click", async () => {
    const date = dateInput.value;
    const pharmacist = document.getElementById("pharmacistName").value;

    if (!date) {
        alert("⚠️ 請先選擇撥補日期");
        return;
    }
    if (!pharmacist) {
        alert("⚠️ 請先選擇撥補藥師");
        return;
    }
    if (!ivDrugList.length) {
        alert("⚠️ 目前沒有點滴主檔");
        return;
    }

    const missingInput = ivDrugList.filter(drug => {
        const d = currentData[drug.id];
        return !d || d.currentQty === "" || d.currentQty === undefined;
    });

    if (missingInput.length) {
        alert("⚠️ 尚有點滴沒有輸入現有量（包含 0 請確實填寫）");
        return;
    }

    let totalReplenish = 0;
    ivDrugList.forEach(drug => {
        totalReplenish += Number(currentData[drug.id].replenishQty || 0);
    });

    const confirmMessage = `確認完成 ${date} 點滴撥補？\n\n品項：${ivDrugList.length} 項\n總撥補量：${totalReplenish}\n撥補藥師：${pharmacist}`;
    if (!confirm(confirmMessage)) return;

    const dailyRecord = {
        date,
        pharmacist,
        completed: true,
        completedAt: new Date().toISOString(),
        totalItems: ivDrugList.length,
        totalReplenish,
        items: currentData
    };

    try {
        await set(ref(db, `ivReplenishment/${date}`), dailyRecord);
        updateCompleteButtonState(true);
        alert("🎉 今日點滴撥補已完成！");
    } catch (error) {
        alert("❌ 儲存失敗\n\n" + error.message);
    }
});

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadIVMaster().then(() => {
    startIVRealtimeSync();
});

</script>
