/* ======================================================

====================================================== */

function getTodayString() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}

    getTodayString();

====================================================== */

/* ======================================================
   📥 Excel 匯入
====================================================== */

document
.getElementById("ivMasterExcel")
.addEventListener(
    "change",
    async (event) => {

        const file =
            event.target.files[0];

        if (!file) return;


        try {

            /* ------------------------------------------
               讀取 Excel
            ------------------------------------------ */

            const data =
                await file.arrayBuffer();


            const workbook =
                XLSX.read(
                    data,
                    {
                        type: "array"
                    }
                );


            const sheetName =
                workbook.SheetNames[0];


            const worksheet =
                workbook.Sheets[
                    sheetName
                ];


            const rows =
                XLSX.utils.sheet_to_json(
                    worksheet,
                    {
                        defval: ""
                    }
                );


            if (!rows.length) {

                alert(
                    "❌ Excel 沒有資料"
                );

                return;

            }


            /* ------------------------------------------
               檢查欄位
            ------------------------------------------ */

            const requiredColumns = [

                "藥品碼",
                "藥品名稱",
                "規格",
                "安全庫存量",
                "啟用"

            ];


            const firstRow =
                rows[0];


            const missingColumns =
                requiredColumns.filter(
                    column =>
                        !(column in firstRow)
                );


            if (
                missingColumns.length
            ) {

                alert(
                    "❌ Excel 欄位不正確\n\n" +
                    "缺少：\n" +
                    missingColumns.join("\n")
                );

                return;

            }


            /* ------------------------------------------
               轉換資料
            ------------------------------------------ */

            const newDrugList = [];


            rows.forEach(
                (row, index) => {

                    const id =
                        String(
                            row["藥品碼"]
                        ).trim();


                    const name =
                        String(
                            row["藥品名稱"]
                        ).trim();


                    const spec =
                        String(
                            row["規格"]
                        ).trim();


                    const safetyStock =
                        Number(
                            row["安全庫存量"]
                        );


                    const enabledText =
                        String(
                            row["啟用"]
                        )
                        .trim()
                        .toUpperCase();


                    /* 空白列 */

                    if (
                        !id &&
                        !name
                    ) {

                        return;

                    }


                    /* 藥品碼 */

                    if (!id) {

                        throw new Error(
                            `第 ${
                                index + 2
                            } 列沒有藥品碼`
                        );

                    }


                    /* 安全庫存 */

                    if (
                        Number.isNaN(
                            safetyStock
                        ) ||
                        safetyStock < 0
                    ) {

                        throw new Error(
                            `第 ${
                                index + 2
                            } 列安全庫存量不正確`
                        );

                    }


                    /* 啟用 */

                    const enabled =
                        ![
                            "N",
                            "NO",
                            "0",
                            "FALSE",
                            "停用"
                        ].includes(
                            enabledText
                        );


                    newDrugList.push({

                        id,

                        name,

                        spec,

                        safetyStock,

                        enabled

                    });

                }
            );


            /* ------------------------------------------
               沒有資料
            ------------------------------------------ */

            if (
                !newDrugList.length
            ) {

                alert(
                    "❌ 沒有有效的點滴資料"
                );

                return;

            }


            /* ------------------------------------------
               重複藥品碼檢查
            ------------------------------------------ */

            const ids =
                newDrugList.map(
                    drug => drug.id
                );


            const duplicateIds =
                ids.filter(
                    (id, index) =>
                        ids.indexOf(id)
                        !== index
                );


            if (
                duplicateIds.length
            ) {

                alert(
                    "❌ Excel 有重複藥品碼：\n\n" +
                    [
                        ...new Set(
                            duplicateIds
                        )
                    ].join("\n")
                );

                return;

            }


            /* ------------------------------------------
               啟用數量
            ------------------------------------------ */

            const enabledList =
                newDrugList.filter(
                    drug =>
                        drug.enabled
                );


            const disabledList =
                newDrugList.filter(
                    drug =>
                        !drug.enabled
                );


            /* ------------------------------------------
               確認
            ------------------------------------------ */

            const confirmMessage =

                "準備匯入點滴主檔\n\n" +

                `全部：${newDrugList.length} 項\n` +

                `啟用：${enabledList.length} 項\n` +

                `停用：${disabledList.length} 項\n\n` +

                "匯入後會更新 Firebase 點滴主檔。\n\n" +

                "確定要繼續嗎？";


            if (
                !confirm(
                    confirmMessage
                )
            ) {

                return;

            }


            /* ------------------------------------------
               寫入 Firebase
            ------------------------------------------ */

            const masterData = {};


            newDrugList.forEach(
                drug => {

                    masterData[
                        drug.id
                    ] = {

                        id:
                            drug.id,

                        name:
                            drug.name,

                        spec:
                            drug.spec,

                        safetyStock:
                            drug.safetyStock,

                        enabled:
                            drug.enabled,

                        updatedAt:
                            new Date()
                            .toISOString()

                    };

                }
            );


            await set(
                ref(
                    db,
                    "ivDrugMaster"
                ),
                masterData
            );


            /* ------------------------------------------
               更新畫面
            ------------------------------------------ */

            ivDrugList =
                enabledList;


            currentData = {};


            renderIVList();


            alert(
                "🎉 點滴主檔匯入成功！\n\n" +
                `啟用中的點滴：${enabledList.length} 項`
            );


        } catch (error) {

            console.error(
                "點滴主檔匯入錯誤：",
                error
            );


            alert(
                "❌ 匯入失敗\n\n" +
                error.message
            );

        }


        /* 清空 input */

        event.target.value = "";

    }
);



/* ======================================================
   📦 從 Firebase 載入點滴主檔
====================================================== */

async function loadIVMaster() {

    try {

        const snapshot =
            await get(
                ref(
                    db,
                    "ivDrugMaster"
                )
            );


        if (
            !snapshot.exists()
        ) {

            ivDrugList = [];

            renderIVList();

            ivList.innerHTML = `

                <div
                    class="
                        text-center
                        py-12
                        text-slate-400
                    ">

                    <div
                        class="
                            text-5xl
                            mb-4
                        ">

                        💧

                    </div>

                    <div
                        class="
                            font-black
                            text-lg
                        ">

                        尚未建立點滴主檔

                    </div>

                    <div
                        class="
                            text-sm
                            mt-2
                        ">

                        請使用電腦匯入
                        「點滴主檔.xlsx」

                    </div>

                </div>

            `;

            return;

        }


        const data =
            snapshot.val();


        ivDrugList =
            Object.values(data)
            .filter(
                drug =>
                    drug.enabled !== false
            )
            .sort(
                (a, b) =>
                    String(a.id)
                    .localeCompare(
                        String(b.id)
                    )
            );


        renderIVList();


    } catch (error) {

        console.error(
            "載入點滴主檔失敗：",
            error
        );


        ivList.innerHTML = `

            <div
                class="
                    text-center
                    py-10
                    text-red-500
                ">

                ❌ 點滴主檔載入失敗

                <div
                    class="
                        text-xs
                        mt-2
                    ">

                    ${error.message}

                </div>

            </div>

        `;

    }

}



/* ======================================================
   💧 顯示點滴清單
====================================================== */

function renderIVList() {

    if (!ivList) return;


    ivList.innerHTML = "";


    if (
        !ivDrugList.length
    ) {

        ivList.innerHTML = `

            <div
                class="
                    text-center
                    py-12
                    text-slate-400
                ">

                <div class="text-5xl mb-4">
                    💧
                </div>

                <div class="font-black">
                    尚未有啟用中的點滴
                </div>

            </div>

        `;

        updateSummary();

        return;

    }


    ivDrugList.forEach(
        drug => {

            const data =
                currentData[
                    drug.id
                ] || {};


            const currentQty =
                Number(
                    data.currentQty || 0
                );


            const safetyStock =
                Number(
                    drug.safetyStock || 0
                );


            const replenishQty =
                Math.max(
                    safetyStock -
                    currentQty,
                    0
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                `iv-card ${
                    replenishQty > 0
                    ? "need"
                    : "ok"
                }
                bg-white
                border
                border-slate-200
                rounded-2xl
                p-4
                shadow-sm`;


            card.innerHTML = `

                <!-- 藥品名稱 -->

                <div
                    class="
                        flex
                        justify-between
                        items-start
                        gap-3
                    ">

                    <div
                        class="
                            flex-1
                            min-w-0
                        ">

                        <div
                            class="
                                font-black
                                text-slate-800
                                text-base
                            ">

                            ${escapeHtml(
                                drug.name
                            )}

                        </div>

                        <div
                            class="
                                text-xs
                                text-slate-400
                                font-mono
                                mt-1
                            ">

                            ${escapeHtml(
                                drug.id
                            )}

                            ·

                            ${escapeHtml(
                                drug.spec || ""
                            )}

                        </div>

                    </div>


                    <!-- 安全庫存 -->

                    <div
                        class="
                            text-right
                            shrink-0
                        ">

                        <div
                            class="
                                text-xs
                                text-slate-400
                            ">

                            安全庫存

                        </div>

                        <div
                            class="
                                text-xl
                                font-black
                                text-blue-600
                            ">

                            ${safetyStock}

                        </div>

                    </div>

                </div>


                <!-- 數量 -->

                <div
                    class="
                        grid
                        grid-cols-3
                        gap-2
                        mt-4
                    ">


                    <!-- 現有 -->

                    <div>

                        <div
                            class="
                                text-xs
                                text-slate-400
                                text-center
                                font-bold
                            ">

                            樓上現有量

                        </div>

                        <input
                            type="number"
                            min="0"
                            step="1"
                            inputmode="numeric"
                            value="${currentQty}"
                            data-id="${escapeHtml(
                                drug.id
                            )}"
                            class="
                                qty-input
                                current-qty
                                w-full
                                border-2
                                border-slate-200
                                rounded-xl
                                py-2
                                mt-1
                                bg-white
                            ">

                    </div>


                    <!-- 應補 -->

                    <div>

                        <div
                            class="
                                text-xs
                                text-slate-400
                                text-center
                                font-bold
                            ">

                            應撥補

                        </div>

                        <div
                            class="
                                replenish-display
                                rounded-xl
                                py-3
                                mt-1
                                text-center
                                font-black
                                ${
                                    replenishQty > 0
                                    ? "bg-red-50 text-red-600"
                                    : "bg-emerald-50 text-emerald-600"
                                }
                            ">

                            ${replenishQty}

                        </div>

                    </div>


                    <!-- 補後 -->

                    <div>

                        <div
                            class="
                                text-xs
                                text-slate-400
                                text-center
                                font-bold
                            ">

                            補後庫存

                        </div>

                        <div
                            class="
                                after-display
                                bg-emerald-50
                                text-emerald-600
                                rounded-xl
                                py-3
                                mt-1
                                text-center
                                font-black
                            ">

                            ${
                                currentQty +
                                replenishQty
                            }

                        </div>

                    </div>

                </div>

            `;


            /* ------------------------------------------
               現有量輸入
            ------------------------------------------ */

            const input =
                card.querySelector(
                    ".current-qty"
                );


            input.addEventListener(
                "input",
                () => {

                    let qty =
                        Number(
                            input.value
                        );


                    if (
                        Number.isNaN(qty) ||
                        qty < 0
                    ) {

                        qty = 0;

                    }


                    qty =
                        Math.floor(qty);


                    input.value =
                        qty;


                    const need =
                        Math.max(
                            safetyStock -
                            qty,
                            0
                        );


                    const afterQty =
                        qty + need;


                    /* 更新資料 */

                    currentData[
                        drug.id
                    ] = {

                        currentQty:
                            qty,

                        safetyStock:
                            safetyStock,

                        replenishQty:
                            need

                    };


                    /* 更新應補 */

                    const replenishDisplay =
                        card.querySelector(
                            ".replenish-display"
                        );


                    replenishDisplay.textContent =
                        need;


                    replenishDisplay.className =
                        `replenish-display
                         rounded-xl
                         py-3
                         mt-1
                         text-center
                         font-black
                         ${
                            need > 0
                            ? "bg-red-50 text-red-600"
                            : "bg-emerald-50 text-emerald-600"
                         }`;


                    /* 更新補後 */

                    card.querySelector(
                        ".after-display"
                    ).textContent =
                        afterQty;


                    /* 更新卡片顏色 */

                    card.classList.remove(
                        "need",
                        "ok"
                    );


                    card.classList.add(
                        need > 0
                        ? "need"
                        : "ok"
                    );


                    updateSummary();

                }
            );


            ivList.appendChild(
                card
            );

        }
    );


    updateSummary();

}



/* ======================================================
   📊 統計
====================================================== */

function updateSummary() {

    const total =
        ivDrugList.length;


    let need = 0;

    let ok = 0;


    ivDrugList.forEach(
        drug => {

            const data =
                currentData[
                    drug.id
                ] || {};


            const qty =
                Number(
                    data.currentQty || 0
                );


            const safety =
                Number(
                    drug.safetyStock || 0
                );


            const replenish =
                Math.max(
                    safety - qty,
                    0
                );


            if (
                replenish > 0
            ) {

                need++;

            } else {

                ok++;

            }

        }
    );


    document.getElementById(
        "totalItems"
    ).textContent =
        total;


    document.getElementById(
        "needItems"
    ).textContent =
        need;


    document.getElementById(
        "okItems"
    ).textContent =
        ok;

}



/* ======================================================
   💾 完成今日撥補
====================================================== */

document
.getElementById("btnComplete")
.addEventListener(
    "click",
    async () => {


        const date =
            dateInput.value;


        const pharmacist =
            document.getElementById(
                "pharmacistName"
            ).value;


        /* ------------------------------------------
           檢查日期
        ------------------------------------------ */

        if (!date) {

            alert(
                "⚠️ 請先選擇撥補日期"
            );

            return;

        }


        /* ------------------------------------------
           檢查藥師
        ------------------------------------------ */

        if (!pharmacist) {

            alert(
                "⚠️ 請先選擇撥補藥師"
            );

            return;

        }


        /* ------------------------------------------
           檢查主檔
        ------------------------------------------ */

        if (
            !ivDrugList.length
        ) {

            alert(
                "⚠️ 目前沒有點滴主檔"
            );

            return;

        }


        /* ------------------------------------------
           檢查是否全部都有輸入
        ------------------------------------------ */

        const missingInput =
            ivDrugList.filter(
                drug =>
                    currentData[
                        drug.id
                    ] === undefined
            );


        if (
            missingInput.length
        ) {

            const names =
                missingInput
                .slice(0, 5)
                .map(
                    drug =>
                        drug.name
                )
                .join("\n");


            const more =
                missingInput.length > 5
                ? `\n...另外還有 ${
                    missingInput.length - 5
                  } 項`
                : "";


            alert(
                "⚠️ 尚有點滴沒有輸入現有量：\n\n" +
                names +
                more
            );


            return;

        }


        /* ------------------------------------------
           計算總撥補量
        ------------------------------------------ */

        let totalReplenish =
            0;


        ivDrugList.forEach(
            drug => {

                totalReplenish +=
                    Number(
                        currentData[
                            drug.id
                        ].replenishQty || 0
                    );

            }
        );


        /* ------------------------------------------
           確認
        ------------------------------------------ */

        const confirmMessage =

            `確認完成 ${date} 點滴撥補？\n\n` +

            `品項：${ivDrugList.length} 項\n` +

            `總撥補量：${totalReplenish}\n\n` +

            `撥補藥師：${pharmacist}`;


        if (
            !confirm(
                confirmMessage
            )
        ) {

            return;

        }


        /* ------------------------------------------
           建立每日紀錄
        ------------------------------------------ */

        const dailyRecord = {

            date:

                date,

            pharmacist:

                pharmacist,

            completed:

                true,

            completedAt:

                new Date()
                .toISOString(),

            totalItems:

                ivDrugList.length,

            totalReplenish:

                totalReplenish,

            items:

                currentData

        };


        try {

            await set(

                ref(
                    db,
                    `ivReplenishment/${date}`
                ),

                dailyRecord

            );


            alert(
                "🎉 今日點滴撥補已完成！"
            );


        } catch (error) {

            console.error(
                "儲存失敗：",
                error
            );


            alert(
                "❌ 儲存失敗\n\n" +
                error.message
            );

        }

    }
);



/* ======================================================
   🔐 HTML 安全處理
====================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
